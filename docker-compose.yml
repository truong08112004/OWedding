services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: owedding-app
        restart: unless-stopped
        ports:
            - "8001:8000"
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8001
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: owedding
            DB_USERNAME: root
            DB_PASSWORD: root
            RUN_SEED_ON_START: "false"
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./:/var/www/html

    db:
        image: mysql:8.0
        container_name: owedding-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: owedding
            MYSQL_ROOT_PASSWORD: root
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - db_data:/var/lib/mysql

volumes:
    db_data:
